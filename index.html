<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding for the HTML document -->
    <meta charset="UTF-8">
    <!-- Ensures proper scaling and rendering on mobile and desktop viewports -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Space Shooter Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
        }

        .title h1 {
            font-size: 36px;
            margin-top: 10em;
            margin-left: auto;
            margin-right: auto;
            text-align: center;

            /* Styling the text and giving it gradient */
            color: #ffffff;
            background: -webkit-linear-gradient(#eee, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 6px 6px 0px rgba(0, 0, 0, 0.2);

            /* Make sure text is in front of background images */
            display: block;
            position: relative;
            z-index: 3;
        }

        @keyframes move-twinkle-back {
            from {
                background-position: 0 0;
            }

            to {
                background-position: -10000px 5000px;
            }
        }

        @keyframes move-clouds-back {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 10000px 0;
            }
        }

        .stars,
        .twinkling,
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            pointer-events: none;
        }

        .stars {
            background: #000 url(stars.png) repeat top center;
            z-index: 0;
        }

        .twinkling {
            background: transparent url(twinkling.png) repeat top center;
            z-index: 1;
            animation: move-twinkle-back 200s linear infinite;
        }

        .clouds {
            background: transparent url(clouds.png) repeat top center;
            z-index: 2;
            opacity: .4;
            animation: move-clouds-back 200s linear infinite;
        }

        /* Make Three.js canvas sit above background effects but behind any UI */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: auto;
        }

        /* Game Over Screen Overlay */
        #gameover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
            /* Hidden by default */
        }

        #gameover-screen h1 {
            color: #ff4266;
            font-size: 55px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 66, 102, 0.6);
            letter-spacing: 2px;
            font-family: 'Lato', sans-serif;
        }

        #restart-btn {
            background: linear-gradient(135deg, #286bff, #164dff);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-family: 'Lato', sans-serif;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 107, 255, 0.4);
            transition: all 0.2s ease;
        }

        #restart-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #3d7aff, #286bff);
            box-shadow: 0 6px 20px rgba(40, 107, 255, 0.6);
        }
    </style>
</head>

<body>
    <!-- Background layers -->
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>
    <div class="title">
        <h1></h1>
    </div>

    <!-- Game Over Screen Overlay -->
    <div id="gameover-screen">
        <h1>GAME OVER</h1>
        <button id="restart-btn">Play Again</button>
    </div>

    <!-- Loads the Three.js r102 library from a CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/102/three.js"></script>

    <script>
        // Store the browser window's current width and height
        const w = window.innerWidth;
        const h = window.innerHeight;

        // 1. SCENE SETUP
        // Create the main 3D world container where all objects live
        const scene = new THREE.Scene();

        // Create a perspective camera (FOV, aspect ratio, near clipping plane, far clipping plane)
        const camera = new THREE.PerspectiveCamera(75, w / h, 0.1, 1000);
        // Position the camera slightly back and up to view the space field
        camera.position.set(0, 3, 10);

        // Initialize the WebGL renderer with anti-aliasing and alpha transparency so the CSS background shows through
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        // Set the renderer size to match the browser window dimensions
        renderer.setSize(w, h);
        // Append the renderer canvas element into the HTML document body
        document.body.appendChild(renderer.domElement);

        // Bright ambient light to ensure no side is pitch black
        const light = new THREE.AmbientLight("#ffffff", 1.5);
        scene.add(light);

        // Hemisphere light to illuminate from top and bottom seamlessly
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        // Directional light to cast highlights across the rocks
        const dirLight = new THREE.DirectionalLight("#ffffff", 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 2. TEXTURES LOADER & ASTEROID BLUEPRINT
        // Instantiate the TextureLoader utility to load image files
        const textureLoader = new THREE.TextureLoader();

        // Load individual texture maps for surface color, normals, height/displacement, roughness, and occlusion
        const tilesBaseColor = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_basecolor.png');
        const tilesNormalMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_normal.png");
        const tilesHeightMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_height.png");
        const tilesRoughnessMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_roughness.png");
        const tilesAmbientOcclusionMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_ambientOcclusion.png");

        // Base geometry size set to 5 for large asteroids
        const asteroidGeometry = new THREE.DodecahedronGeometry(5, 1);
        // Create a physical material that maps our textures and details onto the geometry
        const asteroidMaterial = new THREE.MeshStandardMaterial({
            map: tilesBaseColor,
            normalMap: tilesNormalMap,
            displacementMap: tilesHeightMap,
            displacementScale: 0.6,
            roughnessMap: tilesRoughnessMap,
            roughness: 0.8,
            aoMap: tilesAmbientOcclusionMap
        });

        // 3. GAME ENGINE VARIABLES
        // Array to store and track all active asteroid objects currently in the scene
        let asteroids = [];
        // Timer counter used to control when the next asteroid should spawn
        let spawnTimer = 0;
        // Frame interval count between each new asteroid spawn
        const SPAWN_INTERVAL = 25;
        // Tracks game over state
        let isGameOver = false;

        // Function to generate and place a new random asteroid into the world
        function spawnAsteroid() {
            // Combine our geometry blueprint and material into a renderable 3D mesh object
            const mesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

            // Scale multipliers for size variety
            const scale = 1.5 + Math.random() * 2.0;
            // Apply random unequal scaling across X, Y, and Z to make rocks look unique/jagged
            mesh.scale.set(
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4)
            );

            // Spherical coordinate math variables to spawn rocks in an even wider shell around the camera
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI; // Azimuthal angle (0 to 360 degrees)
            const phi = Math.acos(2.0 * v - 1.0); // Polar angle mapped uniformly across a sphere
            const r = 200 + Math.random() * 100; // Increased radius distance range so they spawn much further out

            // Calculate and set the initial 3D position using spherical-to-cartesian coordinate conversion
            mesh.position.set(
                camera.position.x + r * Math.sin(phi) * Math.cos(theta),
                camera.position.y + r * Math.sin(phi) * Math.sin(theta),
                camera.position.z + r * Math.cos(phi)
            );

            // Add the newly created asteroid mesh to the active Three.js scene
            scene.add(mesh);

            // Generate a random vector direction and normalize it to a length of 1
            const randomDirection = new THREE.Vector3(
                (Math.random() - 0.5),
                (Math.random() - 0.5),
                (Math.random() - 0.5)
            ).normalize();

            // Speed values for the asteroids
            const speed = 0.15 + Math.random() * 0.2;

            // Rotation speed values so they tumble as they move
            const rotSpeed = new THREE.Vector3(
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015
            );

            // 3600 frames = 60 seconds (1 minute) at 60 FPS
            const maxFrames = 3600;

            // Push the asteroid object data package into our active tracking array
            asteroids.push({
                mesh: mesh,
                velocity: randomDirection.multiplyScalar(speed),
                rotSpeed: rotSpeed,
                age: 0,
                maxAge: maxFrames
            });
        }

        // 4. SHIP SETUP
        const mat = {
            hull: new THREE.MeshStandardMaterial({ color: 0x263746, metalness: 0.8, roughness: 0.32, flatShading: true }),
            armor: new THREE.MeshStandardMaterial({ color: 0x8799a5, metalness: 0.75, roughness: 0.3, flatShading: true }),
            dark: new THREE.MeshStandardMaterial({ color: 0x101a27, metalness: 0.7, roughness: 0.35, flatShading: true }),
            gold: new THREE.MeshStandardMaterial({ color: 0xd9a45b, metalness: 0.8, roughness: 0.25, flatShading: true }),
            glass: new THREE.MeshStandardMaterial({ color: 0x09263e, emissive: 0x0874a0, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.12, flatShading: true }),
            cyan: new THREE.MeshStandardMaterial({ color: 0x40f4ff, emissive: 0x00dfff, emissiveIntensity: 3 }),
            blue: new THREE.MeshStandardMaterial({ color: 0x286bff, emissive: 0x164dff, emissiveIntensity: 3 }),
            red: new THREE.MeshStandardMaterial({ color: 0xff4266, emissive: 0xff153d, emissiveIntensity: 2 })
        };

        const ship = new THREE.Group();
        scene.add(ship);
        ship.add(camera);

        function createMesh(geo, material, pos, rot = [0, 0, 0], parent = ship) {
            const m = new THREE.Mesh(geo, material);
            m.position.set(...pos);
            m.rotation.set(...rot);
            m.castShadow = m.receiveShadow = true;
            parent.add(m);
            return m;
        }

        function box(material, pos, size, rot = [0, 0, 0]) {
            return createMesh(new THREE.BoxGeometry(...size), material, pos, rot);
        }

        function cyl(material, pos, top, bottom, height, sides = 8, rot = [0, 0, 0]) {
            return createMesh(new THREE.CylinderGeometry(top, bottom, height, sides), material, pos, rot);
        }

        function beam(material, a, b, radius = 0.025, sides = 6) {
            const start = new THREE.Vector3(...a);
            const direction = new THREE.Vector3(...b).sub(start);
            const length = direction.length();
            if (!length) return;

            const m = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, length, sides),
                material
            );
            m.position.copy(start).addScaledVector(direction, 0.5);
            m.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                direction.normalize()
            );
            m.castShadow = m.receiveShadow = true;
            ship.add(m);
            return m;
        }

        function wing(s) {
            const shape = new THREE.Shape();
            shape.moveTo(s * 0.45, -1.5);
            shape.lineTo(s * 4.5, -0.3);
            shape.lineTo(s * 5.5, 1.7);
            shape.lineTo(s * 3.1, 1.25);
            shape.lineTo(s, 2.25);
            shape.lineTo(s * 0.45, 1.1);
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, {
                depth: 0.24,
                bevelEnabled: false
            });
            geo.rotateX(Math.PI / 2);
            geo.translate(0, 0.12, 0);
            createMesh(geo, mat.hull, [0, 0, 0]);

            beam(mat.armor, [s * 0.45, 0.04, -1.5], [s * 4.5, 0.04, -0.3], 0.07);
            beam(mat.gold, [s * 4.5, 0.04, -0.3], [s * 5.5, 0.04, 1.7], 0.035);
        }

        createMesh(new THREE.CylinderGeometry(0.28, 0.72, 5.1, 6), mat.hull, [0, 0, 0], [Math.PI / 2, 0, 0]);
        createMesh(new THREE.ConeGeometry(0.48, 2, 6), mat.armor, [0, 0, -3.4], [Math.PI / 2, 0, 0]);
        createMesh(new THREE.ConeGeometry(0.29, 1.05, 6), mat.dark, [0, 0, -4], [Math.PI / 2, 0, 0]);
        box(mat.gold, [0, 0.12, -3.55], [0.1, 0.1, 0.85]);

        createMesh(new THREE.CylinderGeometry(0.3, 0.46, 2.7, 5), mat.armor, [0, 0.43, -0.65], [Math.PI / 2, 0, 0]);
        box(mat.dark, [0, 0.67, 0.35], [0.76, 0.23, 1.65]);
        box(mat.armor, [0, 0.81, 0.12], [0.53, 0.09, 1.15]);

        const cockpit = createMesh(new THREE.SphereGeometry(0.67, 6, 4), mat.glass, [0, 0.52, -1.72]);
        cockpit.scale.set(0.76, 0.58, 1.24);

        beam(mat.armor, [-0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.armor, [0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.gold, [0, 0.84, -2.58], [0, 0.25, -1.35], 0.025);

        for (const s of [-1, 1]) {
            beam(mat.armor, [s * 0.48, 0.36, -2.2], [s * 0.62, 0.24, -1.15], 0.055);
            box(mat.gold, [s * 0.47, 0.28, -1.55], [0.09, 0.08, 0.38]);
        }

        wing(-1);
        wing(1);

        function engine(x) {
            const g = new THREE.Group();
            g.position.set(x, -0.1, 1.65);
            ship.add(g);

            const part = (geo, material, pos, rot = [Math.PI / 2, 0, 0]) => createMesh(geo, material, pos, rot, g);

            part(new THREE.CylinderGeometry(0.34, 0.43, 1.65, 8), mat.dark, [0, 0, 0.05]);
            part(new THREE.CylinderGeometry(0.31, 0.36, 0.18, 8), mat.armor, [0, 0, 0.78]);
            part(new THREE.CylinderGeometry(0.23, 0.3, 0.12, 8), mat.gold, [0, 0, 0.9]);
            part(new THREE.CylinderGeometry(0.19, 0.24, 0.18, 8), mat.dark, [0, 0, 1.02]);
            part(new THREE.CylinderGeometry(0.13, 0.18, 0.14, 8), mat.cyan, [0, 0, 1.15]);
            part(new THREE.CylinderGeometry(0.07, 0.12, 0.08, 8), mat.blue, [0, 0, 1.25]);
            part(new THREE.ConeGeometry(0.19, 0.85, 8), mat.blue, [0, 0, 1.7]);

            const light = new THREE.PointLight(0x00cfff, 4, 4);
            light.position.set(0, 0, 1.6);
            g.add(light);
        }

        engine(-0.82);
        engine(0.82);

        cyl(mat.dark, [0, -0.5, 0.45], 0.32, 0.38, 0.45, 6);
        cyl(mat.gold, [0, -0.75, 0.45], 0.24, 0.28, 0.1, 8);
        cyl(mat.cyan, [0, -0.82, 0.45], 0.16, 0.16, 0.06, 8);
        box(mat.dark, [0, -0.42, -0.5], [0.55, 0.3, 1.5]);
        box(mat.gold, [0, -0.6, -0.5], [0.28, 0.055, 0.8]);

        cyl(mat.dark, [0, 0.94, 0.55], 0.06, 0.09, 0.55, 6);
        cyl(mat.gold, [0, 1.23, 0.55], 0.08, 0.08, 0.1, 6);
        beam(mat.armor, [0, 1.24, 0.55], [0, 1.95, 0.55]);
        beam(mat.armor, [-0.3, 1.63, 0.55], [0.3, 1.63, 0.55], 0.02);
        createMesh(new THREE.IcosahedronGeometry(0.09, 0), mat.cyan, [0, 1.98, 0.55]);

        for (const s of [-1, 1]) {
            const fin = createMesh(new THREE.ConeGeometry(0.35, 1.15, 4), mat.armor, [s * 0.53, 0.34, 2.22], [Math.PI / 2, 0, -s * 0.42]);
            fin.scale.set(0.65, 1, 1);

            beam(mat.gold, [s * 0.45, 0.3, 1.55], [s * 0.62, 0.76, 1.9], 0.025);
            createMesh(new THREE.IcosahedronGeometry(0.075, 0), mat.cyan, [s * 0.62, 0.76, 1.9]);

            beam(mat.cyan, [s * 0.36, 0.06, -1], [s * 0.43, 0.06, 1.15], 0.025);
            beam(mat.gold, [s * 0.34, -0.2, -0.55], [s * 0.34, -0.2, 0.65], 0.022);

            for (let i = 0; i < 5; i++)
                box(i % 2 === 0 ? mat.armor : mat.dark, [s * 0.43, 0.18, -0.45 + i * 0.34], [0.08, 0.11, 0.15]);

            cyl(mat.dark, [s * 0.56, 0.15, -1.25], 0.14, 0.18, 0.42, 6, [0, 0, Math.PI / 2]);
            createMesh(new THREE.IcosahedronGeometry(0.075, 0), mat.cyan, [s * 0.82, 0.15, -1.25]);
        }

        const rim = new THREE.PointLight(0x167dff, 35, 25);
        rim.position.set(-6, 3, -5);
        scene.add(rim);

        const fill = new THREE.PointLight(0x00dfff, 12, 18);
        fill.position.set(5, -2, 3);
        scene.add(fill);

        const keys = { w: false, a: false, s: false, d: false, shift: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        function animate() {
            if (isGameOver) return;

            spawnTimer++;
            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnAsteroid();
                spawnTimer = 0;
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];

                asteroid.mesh.position.add(asteroid.velocity);

                asteroid.mesh.rotation.x += asteroid.rotSpeed.x;
                asteroid.mesh.rotation.y += asteroid.rotSpeed.y;
                asteroid.mesh.rotation.z += asteroid.rotSpeed.z;

                asteroid.age++;

                const asteroidCenter = new THREE.Vector3();
                asteroid.mesh.getWorldPosition(asteroidCenter);

                const shipCenter = new THREE.Vector3();
                ship.getWorldPosition(shipCenter);

                const asteroidRadius = 5 * Math.max(
                    asteroid.mesh.scale.x,
                    asteroid.mesh.scale.y,
                    asteroid.mesh.scale.z
                );

                const shipRadius = 4.5;

                if (asteroidCenter.distanceTo(shipCenter) < asteroidRadius + shipRadius) {
                    triggerGameOver();
                    break;
                }

                if (asteroid.age >= asteroid.maxAge) {
                    scene.remove(asteroid.mesh);
                    asteroids.splice(i, 1);
                    continue;
                }

                if (asteroid.mesh.position.distanceTo(camera.position) > 1500) {
                    scene.remove(asteroid.mesh);
                    asteroids.splice(i, 1);
                }
            }

            if (keys.shift) ship.translateZ(-1);
            if (keys.w) ship.rotateX(0.02);
            if (keys.a) ship.rotateZ(0.02);
            if (keys.s) ship.rotateX(-0.02);
            if (keys.d) ship.rotateZ(-0.02);

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function restartGame() {

            for (let i = 0; i < asteroids.length; i++) {
                scene.remove(asteroids[i].mesh);
            }
            asteroids = [];
            spawnTimer = 0;
            isGameOver = false;

            document.getElementById('gameover-screen').style.display = 'none';
        }

        document.getElementById('restart-btn').addEventListener('click', restartGame);

        window.addEventListener('keydown', (event) => {
            if (event.key === 't' || event.key === 'T') {
                const mesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

                mesh.position.set(camera.position.x, camera.position.y, camera.position.z - 35);
                mesh.scale.set(3, 3, 3);
                scene.add(mesh);

                const targetDirection = new THREE.Vector3().subVectors(camera.position, mesh.position).normalize();

                asteroids.push({
                    mesh: mesh,
                    velocity: targetDirection.multiplyScalar(0.8), // Fast test speed
                    rotSpeed: new THREE.Vector3(0.02, 0.02, 0.02),
                    age: 0,
                    maxAge: 3600
                });
            }
        });

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
