<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight Interceptor</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Lato',sans-serif}
        body{background:#080a12}
        @keyframes move-twinkle-back{from{background-position:0 0}to{background-position:-10000px 5000px}}
        @keyframes move-clouds-back{from{background-position:0 0}to{background-position:10000px 0}}
        .stars,.twinkling,.clouds{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none}
        .stars{background:#000 url(stars.png) repeat top center;z-index:0}
        .twinkling{background:transparent url(twinkling.png) repeat top center;z-index:1;animation:move-twinkle-back 200s linear infinite}
        .clouds{background:transparent url(clouds.png) repeat top center;z-index:2;opacity:.4;animation:move-clouds-back 200s linear infinite}
        canvas{display:block;position:fixed;top:0;left:0;z-index:3;pointer-events:auto}
        :root{--menu-font-body:'DM Sans',sans-serif;--menu-font-display:'Bebas Neue',sans-serif;--menu-accent:#ff3b00;--menu-bg:#080a12}
        #menu-home{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;color:#f0f0f4;font-family:var(--menu-font-body);background:radial-gradient(ellipse at 50% 40%,rgba(28,65,115,.45),transparent 55%),linear-gradient(135deg,rgba(4,7,17,.96),rgba(10,13,25,.92));overflow:hidden}
        #menu-home::before{content:"";position:absolute;inset:-50%;pointer-events:none;opacity:.35;background-image:radial-gradient(2px 2px at 20% 30%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 70% 20%,#7ddcff 50%,transparent 60%),radial-gradient(2px 2px at 80% 70%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 35% 80%,#9bbcff 50%,transparent 60%);background-size:260px 240px,310px 300px,370px 330px,220px 280px;animation:menu-stars-drift 55s linear infinite}
        @keyframes menu-stars-drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-120px,80px,0)}}
        .menu-hero{position:relative;z-index:1;width:min(100%,1000px);animation:menu-hero-in .8s cubic-bezier(.2,.8,.2,1) both}
        @keyframes menu-hero-in{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
        .menu-eyebrow{margin-bottom:1.25rem;color:#a5b3c8;font-size:.72rem;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
        .menu-hero h1{margin:0 0 1.25rem;font-family:var(--menu-font-display);font-size:clamp(4.5rem,14vw,10rem);line-height:.82;letter-spacing:.015em;color:#f6f8ff;text-shadow:0 0 38px rgba(60,157,255,.18)}
        .menu-hero h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px #8db7ef}
        .menu-description{max-width:620px;margin:1.8rem auto 2rem;color:#a9b4c6;font-size:clamp(.95rem,2vw,1.08rem);line-height:1.8}
        .menu-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:.9rem;margin-bottom:2.25rem}
        .menu-action{min-width:150px;border:1px solid rgba(143,185,244,.45);border-radius:999px;padding:.95rem 1.7rem;background:rgba(24,45,76,.62);color:#fff;font:700 .85rem var(--menu-font-body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease}
        .menu-action:hover{transform:translateY(-3px);background:rgba(43,90,151,.72);border-color:#8dc7ff;box-shadow:0 10px 35px rgba(20,122,255,.18)}
        .menu-action.primary{background:#ff3b00;border-color:#ff3b00;box-shadow:0 8px 28px rgba(255,59,0,.2)}
        .menu-action.primary:hover{background:#ff5726;border-color:#ff5726;box-shadow:0 10px 38px rgba(255,59,0,.32)}
        .menu-preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;width:min(100%,760px);margin:0 auto;opacity:.75}
        .menu-preview div{height:clamp(52px,8vw,88px);border:1px solid rgba(144,183,237,.18);border-radius:10px;background:linear-gradient(135deg,rgba(79,112,157,.25),rgba(14,25,44,.4));box-shadow:inset 0 1px rgba(255,255,255,.04)}
        .menu-preview div:nth-child(2),.menu-preview div:nth-child(4){background:linear-gradient(135deg,rgba(255,75,25,.16),rgba(17,29,50,.45))}
        #menu-home[hidden]{display:none}
        #menu-toggle{position:fixed;top:1.5rem;right:1.5rem;z-index:120;width:3.25rem;height:3.25rem;border:1px solid rgba(160,190,235,.2);border-radius:50%;background:#171d2a;cursor:pointer;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 24px rgba(0,0,0,.3);transition:background .3s,transform .3s}
        #menu-toggle:hover{background:var(--menu-accent);transform:scale(1.06)}
        #menu-toggle span{display:block;width:1.35rem;height:2px;background:#fff;border-radius:2px;transition:transform .4s cubic-bezier(.7,0,.2,1),opacity .3s,width .3s}
        #menu-toggle.is-open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
        #menu-toggle.is-open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
        #menu-toggle.is-open span:nth-child(2){opacity:0;width:0}
        #menu-overlay{position:fixed;inset:0;z-index:110;display:flex;flex-direction:column;overflow:hidden;pointer-events:none;background:var(--menu-bg);clip-path:circle(0% at calc(100% - 3.125rem) 3.125rem);transition:clip-path .75s cubic-bezier(.76,0,.24,1);visibility:hidden}
        #menu-overlay.is-open{clip-path:circle(170% at calc(100% - 3.125rem) 3.125rem);pointer-events:auto;visibility:visible}
        .menu-inner{display:flex;flex-direction:column;justify-content:center;min-height:100%;width:min(100% - 4rem,1200px);margin:0 auto;padding:5rem 0 3rem;box-sizing:border-box}
        .menu-label{margin-bottom:1.5rem;color:#6f7d95;font-size:.68rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
        #menu-overlay.is-open .menu-label{opacity:1;transform:translateY(0)}
        .menu-nav{display:flex;flex-direction:column;list-style:none;margin:0;padding:1rem 0}
        .menu-item{overflow:hidden;border-top:1px solid #202635}
        .menu-item:last-child{border-bottom:1px solid #202635}
        .menu-link-wrap{display:flex;align-items:center;justify-content:space-between;padding:.25rem 0}
        .menu-link{position:relative;padding:.3rem 0;color:#f0f3fa;font-family:var(--menu-font-display);font-size:clamp(3.5rem,9vw,8rem);line-height:1;letter-spacing:.02em;text-decoration:none;transform:translateY(110%);transition:transform .7s cubic-bezier(.76,0,.24,1),color .25s}
        #menu-overlay.is-open .menu-link{transform:translateY(0)}
        #menu-overlay.is-open .menu-link#about-menu-link{transition-delay:.1s}
        #menu-overlay.is-open .menu-link#play-menu-link{transition-delay:.2s}
        .menu-link:hover{color:var(--menu-accent)}
        .menu-link::after{content:"";position:absolute;left:0;bottom:.15rem;width:0;height:3px;border-radius:2px;background:var(--menu-accent);transition:width .35s cubic-bezier(.76,0,.24,1)}
        .menu-link:hover::after{width:100%}
        .menu-number{padding-bottom:.6rem;color:#58647a;font-family:var(--menu-font-display);font-size:.9rem;letter-spacing:.15em;opacity:0;transform:translateY(10px);transition:transform .4s,opacity .4s}
        #menu-overlay.is-open .menu-number{opacity:1;transform:translateY(0)}
        #menu-overlay.is-open .menu-item:nth-child(1) .menu-number{transition-delay:.1s}
        #menu-overlay.is-open .menu-item:nth-child(2) .menu-number{transition-delay:.2s}
        #gameover-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);flex-direction:column;justify-content:center;align-items:center;z-index:100;display:none}
        #gameover-screen h1{color:#ff4266;font-size:55px;margin-bottom:20px;text-shadow:0 0 20px rgba(255,66,102,.6);letter-spacing:2px;font-family:'Lato',sans-serif}
        #restart-btn{background:linear-gradient(135deg,#286bff,#164dff);color:white;border:none;padding:15px 35px;font-size:20px;font-family:'Lato',sans-serif;font-weight:bold;border-radius:8px;cursor:pointer;box-shadow:0 4px 15px rgba(40,107,255,.4);transition:all .2s ease}
        #restart-btn:hover{transform:scale(1.05);background:linear-gradient(135deg,#3d7aff,#286bff);box-shadow:0 6px 20px rgba(40,107,255,.6)}
        #Webcam{position:fixed;top:20px;left:20px;width:160px;height:120px;background:transparent;border:none;border-radius:0;z-index:99999;display:none;overflow:hidden;box-sizing:border-box;box-shadow:none}
        #VElement{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
        #tracking-status{display:none}
        #crosshair{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);z-index:60;pointer-events:none;display:none}
        #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(64,244,255,.9);border-radius:1px}
        #crosshair::before{width:2px;height:22px;left:10px;top:0}
        #crosshair::after{width:22px;height:2px;left:0;top:10px}
        #score-hud{position:fixed;top:20px;right:20px;z-index:60;display:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;pointer-events:none}
        @media(max-width:600px){#menu-home{padding:1.25rem;box-sizing:border-box}.menu-preview{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-inner{width:calc(100% - 2.5rem)}#menu-toggle{top:1rem;right:1rem}#gameover-screen h1{font-size:42px}#Webcam{width:130px;height:125px;top:10px;left:10px}#score-hud{top:65px;right:12px;font-size:13px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    </style>
</head>
<body>
    <div id="Webcam">
        <video autoplay muted playsinline id="VElement"></video>
        <div id="tracking-status">CAMERA OFF</div>
    </div>

    <section id="menu-home" aria-label="Starlight Interceptor main menu">
        <div class="menu-hero">
            <p class="menu-eyebrow">GAME FOR HACKATHON</p>
            <h1>Star <span>Interceptor</span></h1>
            <p class="menu-description">Pilot an agile starfighter through hazardous debris fields and alien armadas. Dodge asteroids, explore deep space, and see how long you can survive.</p>
            <div class="menu-actions">
                <button class="menu-action primary" id="start-game-btn">Play Game</button>
                <button class="menu-action" id="about-game-btn">About</button>
            </div>
            <div class="menu-preview" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
        </div>
    </section>

    <button id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>

    <nav id="menu-overlay" aria-label="Game navigation" inert>
        <div class="menu-inner">
            <div class="menu-label">Navigation</div>
            <ul class="menu-nav">
                <li class="menu-item"><div class="menu-link-wrap"><a href="#" class="menu-link" id="about-menu-link">About</a><span class="menu-number">01</span></div></li>
                <li class="menu-item"><div class="menu-link-wrap"><a href="#" class="menu-link" id="play-menu-link">Play</a><span class="menu-number">02</span></div></li>
            </ul>
        </div>
    </nav>

    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>
    <div id="crosshair"></div>
    <div id="score-hud">SCORE: 0</div>

    <div id="gameover-screen">
        <h1>GAME OVER</h1>
        <button id="restart-btn">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/102/three.js"></script>
    <script>
        const webcam = document.getElementById("Webcam");
        const video = document.getElementById("VElement");
        const trackingStatus = document.getElementById("tracking-status");

        const trackingCanvas = document.createElement("canvas");
        trackingCanvas.width = 160;
        trackingCanvas.height = 120;

        const trackingContext = trackingCanvas.getContext("2d", { willReadFrequently: true });
        const webcamKeys = { w: false, a: false, s: false, d: false };

        let webcamStream = null;
        let webcamStarting = false;
        let trackingFrameCounter = 0;
        let webcamBlueDetected = false;
        let keyboardShooting = false;

        function resetWebcamKeys() {
            webcamKeys.w = false;
            webcamKeys.a = false;
            webcamKeys.s = false;
            webcamKeys.d = false;
        }

        async function startWebcam() {
            webcam.style.display = "block";

            if (webcamStream && video.srcObject === webcamStream) {
                trackingStatus.textContent = "RED STEERS • BLUE SHOOTS";
                return;
            }

            if (webcamStarting) return;
            webcamStarting = true;
            trackingStatus.textContent = "REQUESTING CAMERA...";

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Camera needs HTTPS or localhost.");
                }

                webcamStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 320 },
                        height: { ideal: 240 }
                    },
                    audio: false
                });

                video.srcObject = webcamStream;
                await video.play();
                trackingStatus.textContent = "RED STEERS • BLUE SHOOTS";
            } catch (error) {
                console.error("Webcam error:", error);
                trackingStatus.textContent = "CAMERA BLOCKED";
                webcamStream = null;
            } finally {
                webcamStarting = false;
            }
        }

        function stopWebcam() {
            if (webcamStream) webcamStream.getTracks().forEach(track => track.stop());

            webcamStream = null;
            video.srcObject = null;
            webcam.style.display = "none";
            trackingStatus.textContent = "CAMERA OFF";
            webcamBlueDetected = false;
            keyboardShooting = false;
            isShooting = false;
            resetWebcamKeys();
        }

        function updateRedTracking() {
            trackingFrameCounter++;
            if (trackingFrameCounter % 3 !== 0) return;

            resetWebcamKeys();

            if (!trackingContext || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || video.videoWidth === 0) {
                if (webcam.style.display !== "none" && !webcamStarting) trackingStatus.textContent = "WAITING FOR CAMERA";
                return;
            }

            trackingContext.drawImage(video, 0, 0, trackingCanvas.width, trackingCanvas.height);

            const pixels = trackingContext.getImageData(0, 0, trackingCanvas.width, trackingCanvas.height).data;
            const width = trackingCanvas.width;
            const height = trackingCanvas.height;

            let totalBrightness = 0;
            let totalSamples = 0;

            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const i = (y * width + x) * 4;
                    totalBrightness += Math.max(pixels[i], pixels[i + 1], pixels[i + 2]) / 255;
                    totalSamples++;
                }
            }

            const averageBrightness = totalBrightness / Math.max(1, totalSamples);
            const brightnessThreshold = Math.max(0.055, averageBrightness * 0.4);

            let redPixels = 0;
            let totalX = 0;
            let totalY = 0;

            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const i = (y * width + x) * 4;
                    const r = pixels[i] / 255;
                    const g = pixels[i + 1] / 255;
                    const b = pixels[i + 2] / 255;

                    const maxValue = Math.max(r, g, b);
                    const minValue = Math.min(r, g, b);
                    const difference = maxValue - minValue;

                    if (maxValue < brightnessThreshold || maxValue === 0) continue;

                    const saturation = difference / maxValue;
                    if (saturation < 0.4) continue;

                    let hue = 0;

                    if (difference !== 0) {
                        if (maxValue === r) hue = 60 * (((g - b) / difference) % 6);
                        else if (maxValue === g) hue = 60 * ((b - r) / difference + 2);
                        else hue = 60 * ((r - g) / difference + 4);
                    }

                    if (hue < 0) hue += 360;

                    if (hue < 18 || hue > 342) {
                        redPixels++;
                        totalX += x;
                        totalY += y;
                    }
                }
            }

            if (redPixels < 8) {
                if (!webcamBlueDetected) trackingStatus.textContent = "RED OBJECT NOT FOUND";
                return;
            }

            const rawCenterX = (totalX / redPixels) / (width - 1);
            const centerY = (totalY / redPixels) / (height - 1);
            const centerX = 1 - rawCenterX;

            if (centerX < 0.4) webcamKeys.a = true;
            else if (centerX > 0.6) webcamKeys.d = true;

            if (centerY < 0.4) webcamKeys.w = true;
            else if (centerY > 0.6) webcamKeys.s = true;

            if (!webcamBlueDetected) {
                trackingStatus.textContent = "RED TRACKED • " +
                    (webcamKeys.a ? "LEFT " : "") +
                    (webcamKeys.d ? "RIGHT " : "") +
                    (webcamKeys.w ? "UP " : "") +
                    (webcamKeys.s ? "DOWN " : "");

                if (!webcamKeys.a && !webcamKeys.d && !webcamKeys.w && !webcamKeys.s) {
                    trackingStatus.textContent = "RED TRACKED • CENTER";
                }
            }
        }

        function updateBlueTracking() {
            if (!trackingContext ||
                video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
                video.videoWidth === 0) {
                webcamBlueDetected = false;
                isShooting = keyboardShooting;
                return;
            }

            trackingContext.drawImage(video, 0, 0, trackingCanvas.width, trackingCanvas.height);

            const pixels = trackingContext.getImageData(
                0, 0, trackingCanvas.width, trackingCanvas.height
            ).data;

            const width = trackingCanvas.width;
            const height = trackingCanvas.height;
            let bluePixels = 0;

            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x += 2) {
                    const i = (y * width + x) * 4;
                    const r = pixels[i] / 255;
                    const g = pixels[i + 1] / 255;
                    const b = pixels[i + 2] / 255;

                    const maxValue = Math.max(r, g, b);
                    const minValue = Math.min(r, g, b);
                    const difference = maxValue - minValue;

                    if (maxValue < 0.07) continue;

                    const saturation = maxValue > 0 ? difference / maxValue : 0;

                    let hue = 0;

                    if (difference !== 0) {
                        if (maxValue === r) hue = 60 * (((g - b) / difference) % 6);
                        else if (maxValue === g) hue = 60 * ((b - r) / difference + 2);
                        else hue = 60 * ((r - g) / difference + 4);
                    }

                    if (hue < 0) hue += 360;

                    const broadBlueHue = hue >= 160 && hue <= 285;
                    const blueDominance = b > r * 1.02 && b > g * 0.72;
                    const blueTint = b > 0.12 && b > r * 1.08 && b > g * 0.78;

                    if (
                        broadBlueHue &&
                        saturation > 0.08 &&
                        (blueDominance || blueTint)
                    ) {
                        bluePixels++;
                    }
                }
            }

            webcamBlueDetected = bluePixels >= 12;
            isShooting = keyboardShooting || webcamBlueDetected;

            if (webcamBlueDetected) {
                trackingStatus.textContent = "BLUE DETECTED • SHOOTING";
            }
        }

        let w = window.innerWidth;
        let h = window.innerHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, w / h, 0.1, 1000);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight("#ffffff", 1.5));

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight("#ffffff", 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const textureLoader = new THREE.TextureLoader();
        const tilesBaseColor = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_basecolor.png");
        const tilesNormalMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_normal.png");
        const tilesHeightMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_height.png");
        const tilesRoughnessMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_roughness.png");
        const tilesAmbientOcclusionMap = textureLoader.load("./picture/Cobblestone_Irregular_Floor_001_ambientOcclusion.png");

        const asteroidGeometry = new THREE.DodecahedronGeometry(5, 1);
        const asteroidMaterial = new THREE.MeshStandardMaterial({
            map: tilesBaseColor,
            normalMap: tilesNormalMap,
            displacementMap: tilesHeightMap,
            displacementScale: 0.6,
            roughnessMap: tilesRoughnessMap,
            roughness: 0.8,
            aoMap: tilesAmbientOcclusionMap
        });

        let asteroids = [];
        let spawnTimer = 0;
        const SPAWN_INTERVAL = 25;
        let isGameOver = false;
        let isInMenu = true;
        let score = 0;
        const scoreHud = document.getElementById("score-hud");

        function updateScoreDisplay() {
            scoreHud.textContent = "SCORE: " + score;
        }

        let bullets = [];
        let isShooting = false;
        let lastShotTime = 0;

        const SHOT_INTERVAL = 120;
        const BULLET_SPEED = 7;
        const BULLET_LIFETIME = 100;
        const BULLET_CAPACITY = 20;
        const RELOAD_COOLDOWN = 1800;

        let bulletsRemaining = BULLET_CAPACITY;
        let isReloading = false;
        let reloadTimeout = null;

        const ammoHud = document.createElement("div");
        Object.assign(ammoHud.style, {
            position: "fixed",
            left: "50%",
            bottom: "24px",
            transform: "translateX(-50%)",
            zIndex: "60",
            padding: "10px 18px",
            border: "1px solid rgba(64, 244, 255, 0.7)",
            borderRadius: "8px",
            background: "rgba(8, 10, 18, 0.8)",
            color: "#40f4ff",
            fontFamily: "'DM Sans', sans-serif",
            fontSize: "16px",
            fontWeight: "700",
            letterSpacing: "2px",
            textAlign: "center",
            pointerEvents: "none",
            display: "none"
        });
        document.body.appendChild(ammoHud);

        function updateAmmoDisplay() {
            if (isReloading) {
                ammoHud.textContent = "RELOADING...";
                ammoHud.style.color = "#ffb347";
                ammoHud.style.borderColor = "rgba(255, 179, 71, 0.8)";
            } else {
                ammoHud.textContent = "AMMO: " + bulletsRemaining + " / " + BULLET_CAPACITY;
                ammoHud.style.color = "#40f4ff";
                ammoHud.style.borderColor = "rgba(64, 244, 255, 0.7)";
            }
        }

        function startReload() {
            if (isReloading || isGameOver || isInMenu) return;

            isReloading = true;
            updateAmmoDisplay();

            reloadTimeout = window.setTimeout(function () {
                bulletsRemaining = BULLET_CAPACITY;
                isReloading = false;
                reloadTimeout = null;
                updateAmmoDisplay();
            }, RELOAD_COOLDOWN);
        }

        function resetAmmo() {
            if (reloadTimeout !== null) {
                window.clearTimeout(reloadTimeout);
                reloadTimeout = null;
            }

            bulletsRemaining = BULLET_CAPACITY;
            isReloading = false;
            updateAmmoDisplay();
        }

        const bulletGeometry = new THREE.CylinderGeometry(0.045, 0.045, 1.4, 6);
        const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        function shootBullet() {
            if (isInMenu || isGameOver || isReloading) return;

            if (bulletsRemaining <= 0) {
                startReload();
                return;
            }

            ship.updateMatrixWorld(true);

            const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
            const bulletPosition = new THREE.Vector3(0, 0, -5);
            ship.localToWorld(bulletPosition);
            bullet.position.copy(bulletPosition);

            const direction = new THREE.Vector3(0, 0, -1)
                .applyQuaternion(ship.getWorldQuaternion(new THREE.Quaternion()))
                .normalize();

            bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            scene.add(bullet);

            bullets.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(BULLET_SPEED),
                age: 0
            });

            bulletsRemaining--;
            updateAmmoDisplay();

            if (bulletsRemaining === 0) startReload();
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.mesh.position.add(bullet.velocity);
                bullet.age++;

                let hitAsteroid = false;

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const distance = bullet.mesh.position.distanceTo(asteroid.mesh.position);
                    const asteroidRadius = 5 * Math.max(
                        asteroid.mesh.scale.x,
                        asteroid.mesh.scale.y,
                        asteroid.mesh.scale.z
                    );

                    if (distance < asteroidRadius + 0.7) {
                        asteroid.hitsRemaining--;

                        if (asteroid.hitsRemaining <= 0) {
                            scene.remove(asteroid.mesh);
                            asteroids.splice(j, 1);
                            score += 100;
                            updateScoreDisplay();
                        }

                        hitAsteroid = true;
                        break;
                    }
                }

                if (hitAsteroid || bullet.age >= BULLET_LIFETIME) {
                    scene.remove(bullet.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function clearBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) scene.remove(bullets[i].mesh);
            bullets = [];
            isShooting = false;
            resetAmmo();
        }

        window.addEventListener("keydown", function (event) {
            if (event.code !== "Space" || event.repeat || isInMenu || isGameOver) return;

            event.preventDefault();
            keyboardShooting = true;
            isShooting = true;
            shootBullet();
            lastShotTime = performance.now();
        });

        window.addEventListener("keyup", function (event) {
            if (event.code !== "Space") return;
            event.preventDefault();
            keyboardShooting = false;
            isShooting = webcamBlueDetected;
        });

        window.addEventListener("blur", function () {
            keyboardShooting = false;
            isShooting = webcamBlueDetected;
        });

        function spawnAsteroid() {
            const mesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
            const scale = 1.5 + Math.random() * 2;

            mesh.scale.set(
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4)
            );

            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 200 + Math.random() * 100;
            const cameraPosition = new THREE.Vector3();
            camera.getWorldPosition(cameraPosition);

            mesh.position.set(
                cameraPosition.x + r * Math.sin(phi) * Math.cos(theta),
                cameraPosition.y + r * Math.sin(phi) * Math.sin(theta),
                cameraPosition.z + r * Math.cos(phi)
            );

            scene.add(mesh);

            const velocity = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize().multiplyScalar(0.15 + Math.random() * 0.2);

            const rotSpeed = new THREE.Vector3(
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015
            );

            asteroids.push({
                mesh,
                velocity,
                rotSpeed,
                age: 0,
                maxAge: 3600,
                hitsRemaining: 2
            });
        }

        const mat = {
            hull: new THREE.MeshStandardMaterial({ color: 0x263746, metalness: 0.8, roughness: 0.32, flatShading: true }),
            armor: new THREE.MeshStandardMaterial({ color: 0x8799a5, metalness: 0.75, roughness: 0.3, flatShading: true }),
            dark: new THREE.MeshStandardMaterial({ color: 0x101a27, metalness: 0.7, roughness: 0.35, flatShading: true }),
            gold: new THREE.MeshStandardMaterial({ color: 0xd9a45b, metalness: 0.8, roughness: 0.25, flatShading: true }),
            glass: new THREE.MeshStandardMaterial({ color: 0x09263e, emissive: 0x0874a0, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.12, flatShading: true }),
            cyan: new THREE.MeshStandardMaterial({ color: 0x40f4ff, emissive: 0x00dfff, emissiveIntensity: 3 }),
            blue: new THREE.MeshStandardMaterial({ color: 0x286bff, emissive: 0x164dff, emissiveIntensity: 3 }),
            red: new THREE.MeshStandardMaterial({ color: 0xff4266, emissive: 0xff153d, emissiveIntensity: 2 })
        };

        const ship = new THREE.Group();
        scene.add(ship);
        ship.add(camera);

        function createMesh(geo, material, pos, rot = [0, 0, 0], parent = ship) {
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(...pos);
            mesh.rotation.set(...rot);
            mesh.castShadow = mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        function box(material, pos, size, rot = [0, 0, 0]) {
            return createMesh(new THREE.BoxGeometry(...size), material, pos, rot);
        }

        function cyl(material, pos, top, bottom, height, sides = 8, rot = [0, 0, 0]) {
            return createMesh(new THREE.CylinderGeometry(top, bottom, height, sides), material, pos, rot);
        }

        function beam(material, a, b, radius = 0.025, sides = 6) {
            const start = new THREE.Vector3(...a);
            const direction = new THREE.Vector3(...b).sub(start);
            const length = direction.length();
            if (!length) return;

            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, sides), material);
            mesh.position.copy(start).addScaledVector(direction, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
            mesh.castShadow = mesh.receiveShadow = true;
            ship.add(mesh);
            return mesh;
        }

        function wing(s) {
            const shape = new THREE.Shape();
            shape.moveTo(s * 0.45, -1.5);
            shape.lineTo(s * 4.5, -0.3);
            shape.lineTo(s * 5.5, 1.7);
            shape.lineTo(s * 3.1, 1.25);
            shape.lineTo(s, 2.25);
            shape.lineTo(s * 0.45, 1.1);
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.24, bevelEnabled: false });
            geo.rotateX(Math.PI / 2);
            geo.translate(0, 0.12, 0);
            createMesh(geo, mat.hull, [0, 0, 0]);

            beam(mat.armor, [s * 0.45, 0.04, -1.5], [s * 4.5, 0.04, -0.3], 0.07);
            beam(mat.gold, [s * 4.5, 0.04, -0.3], [s * 5.5, 0.04, 1.7], 0.035);
        }

        createMesh(new THREE.CylinderGeometry(0.28, 0.72, 5.1, 6), mat.hull, [0, 0, 0], [Math.PI / 2, 0, 0]);
        createMesh(new THREE.ConeGeometry(0.48, 2, 6), mat.armor, [0, 0, -3.4], [Math.PI / 2, 0, 0]);
        createMesh(new THREE.ConeGeometry(0.29, 1.05, 6), mat.dark, [0, 0, -4], [Math.PI / 2, 0, 0]);

        box(mat.gold, [0, 0.12, -3.55], [0.1, 0.1, 0.85]);
        createMesh(new THREE.CylinderGeometry(0.3, 0.46, 2.7, 5), mat.armor, [0, 0.43, -0.65], [Math.PI / 2, 0, 0]);
        box(mat.dark, [0, 0.67, 0.35], [0.76, 0.23, 1.65]);
        box(mat.armor, [0, 0.81, 0.12], [0.53, 0.09, 1.15]);

        const cockpit = createMesh(new THREE.SphereGeometry(0.67, 6, 4), mat.glass, [0, 0.52, -1.72]);
        cockpit.scale.set(0.76, 0.58, 1.24);

        beam(mat.armor, [-0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.armor, [0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.gold, [0, 0.84, -2.58], [0, 0.25, -1.35], 0.025);

        for (const s of [-1, 1]) {
            beam(mat.armor, [s * 0.48, 0.36, -2.2], [s * 0.62, 0.24, -1.15], 0.055);
            box(mat.gold, [s * 0.47, 0.28, -1.55], [0.09, 0.08, 0.38]);
        }

        wing(-1);
        wing(1);

        function engine(x) {
            const group = new THREE.Group();
            group.position.set(x, -0.1, 1.65);
            ship.add(group);

            const part = (geo, material, pos, rot = [Math.PI / 2, 0, 0]) => createMesh(geo, material, pos, rot, group);

            part(new THREE.CylinderGeometry(0.34, 0.43, 1.65, 8), mat.dark, [0, 0, 0.05]);
            part(new THREE.CylinderGeometry(0.31, 0.36, 0.18, 8), mat.armor, [0, 0, 0.78]);
            part(new THREE.CylinderGeometry(0.23, 0.3, 0.12, 8), mat.gold, [0, 0, 0.9]);
            part(new THREE.CylinderGeometry(0.19, 0.24, 0.18, 8), mat.dark, [0, 0, 1.02]);
            part(new THREE.CylinderGeometry(0.13, 0.18, 0.14, 8), mat.cyan, [0, 0, 1.15]);
            part(new THREE.CylinderGeometry(0.07, 0.12, 0.08, 8), mat.blue, [0, 0, 1.25]);
            part(new THREE.ConeGeometry(0.19, 0.85, 8), mat.blue, [0, 0, 1.7]);

            const engineLight = new THREE.PointLight(0x00cfff, 4, 4);
            engineLight.position.set(0, 0, 1.6);
            group.add(engineLight);
        }

        engine(-0.82);
        engine(0.82);

        cyl(mat.dark, [0, -0.5, 0.45], 0.32, 0.38, 0.45, 6);
        cyl(mat.gold, [0, -0.75, 0.45], 0.24, 0.28, 0.1, 8);
        cyl(mat.cyan, [0, -0.82, 0.45], 0.16, 0.16, 0.06, 8);
        box(mat.dark, [0, -0.42, -0.5], [0.55, 0.3, 1.5]);
        box(mat.gold, [0, -0.6, -0.5], [0.28, 0.055, 0.8]);

        cyl(mat.dark, [0, 0.94, 0.55], 0.06, 0.09, 0.55, 6);
        cyl(mat.gold, [0, 1.23, 0.55], 0.08, 0.08, 0.1, 6);
        beam(mat.armor, [0, 1.24, 0.55], [0, 1.95, 0.55]);
        beam(mat.armor, [-0.3, 1.63, 0.55], [0.3, 1.63, 0.55], 0.02);
        createMesh(new THREE.IcosahedronGeometry(0.09, 0), mat.cyan, [0, 1.98, 0.55]);

        for (const s of [-1, 1]) {
            const fin = createMesh(new THREE.ConeGeometry(0.35, 1.15, 4), mat.armor, [s * 0.53, 0.34, 2.22], [Math.PI / 2, 0, -s * 0.42]);
            fin.scale.set(0.65, 1, 1);

            beam(mat.gold, [s * 0.45, 0.3, 1.55], [s * 0.62, 0.76, 1.9], 0.025);
            createMesh(new THREE.IcosahedronGeometry(0.075, 0), mat.cyan, [s * 0.62, 0.76, 1.9]);
            beam(mat.cyan, [s * 0.36, 0.06, -1], [s * 0.43, 0.06, 1.15], 0.025);
            beam(mat.gold, [s * 0.34, -0.2, -0.55], [s * 0.34, -0.2, 0.65], 0.022);

            for (let i = 0; i < 5; i++) {
                box(i % 2 === 0 ? mat.armor : mat.dark, [s * 0.43, 0.18, -0.45 + i * 0.34], [0.08, 0.11, 0.15]);
            }

            cyl(mat.dark, [s * 0.56, 0.15, -1.25], 0.14, 0.18, 0.42, 6, [0, 0, Math.PI / 2]);
            createMesh(new THREE.IcosahedronGeometry(0.075, 0), mat.cyan, [s * 0.82, 0.15, -1.25]);
        }

        const rim = new THREE.PointLight(0x167dff, 35, 25);
        rim.position.set(-6, 3, -5);
        scene.add(rim);

        const fill = new THREE.PointLight(0x00dfff, 12, 18);
        fill.position.set(5, -2, 3);
        scene.add(fill);

        let thrusterParticles = [];
        const thrusterParticleGeometry = new THREE.SphereGeometry(0.07, 4, 4);

        function createThrusterParticle() {
            if (isInMenu || isGameOver) return;

            ship.updateMatrixWorld(true);

            for (const side of [-1, 1]) {
                const particleMaterial = new THREE.MeshBasicMaterial({
                    color: Math.random() > 0.5 ? 0x40f4ff : 0x286bff,
                    transparent: true,
                    opacity: 0.9,
                    depthWrite: false
                });

                const particle = new THREE.Mesh(thrusterParticleGeometry, particleMaterial);
                const localPosition = new THREE.Vector3(side * 0.82, -0.1, 3.45);
                ship.localToWorld(localPosition);
                particle.position.copy(localPosition);

                const direction = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    1
                ).applyQuaternion(ship.getWorldQuaternion(new THREE.Quaternion())).normalize();

                scene.add(particle);

                thrusterParticles.push({
                    mesh: particle,
                    velocity: direction.multiplyScalar(0.25 + Math.random() * 0.35),
                    age: 0,
                    lifetime: 15 + Math.floor(Math.random() * 12)
                });
            }
        }

        function updateThrusterParticles() {
            for (let i = thrusterParticles.length - 1; i >= 0; i--) {
                const particle = thrusterParticles[i];
                particle.mesh.position.add(particle.velocity);
                particle.age++;

                const remaining = 1 - particle.age / particle.lifetime;
                particle.mesh.material.opacity = Math.max(0, remaining);
                particle.mesh.scale.setScalar(Math.max(0.1, remaining));

                if (particle.age >= particle.lifetime) {
                    scene.remove(particle.mesh);
                    particle.mesh.material.dispose();
                    thrusterParticles.splice(i, 1);
                }
            }
        }

        function clearThrusterParticles() {
            for (const particle of thrusterParticles) {
                scene.remove(particle.mesh);
                particle.mesh.material.dispose();
            }
            thrusterParticles = [];
        }

        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener("keydown", event => {
            const key = event.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });

        window.addEventListener("keyup", event => {
            const key = event.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        function resetKeys() {
            Object.keys(keys).forEach(key => keys[key] = false);
        }

        function animate() {
            if (isGameOver || isInMenu) {
                renderer.render(scene, camera);
                return;
            }

            updateRedTracking();
            updateBlueTracking();

            spawnTimer++;

            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnAsteroid();
                spawnTimer = 0;
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];

                asteroid.mesh.position.add(asteroid.velocity);
                asteroid.mesh.rotation.x += asteroid.rotSpeed.x;
                asteroid.mesh.rotation.y += asteroid.rotSpeed.y;
                asteroid.mesh.rotation.z += asteroid.rotSpeed.z;
                asteroid.age++;

                const asteroidCenter = new THREE.Vector3();
                asteroid.mesh.getWorldPosition(asteroidCenter);

                const shipCenter = new THREE.Vector3();
                ship.getWorldPosition(shipCenter);

                const asteroidRadius = 5 * Math.max(
                    asteroid.mesh.scale.x,
                    asteroid.mesh.scale.y,
                    asteroid.mesh.scale.z
                );

                const shipRadius = 4.5;

                if (asteroidCenter.distanceTo(shipCenter) < asteroidRadius + shipRadius) {
                    triggerGameOver();
                    break;
                }

                const cameraWorldPosition = new THREE.Vector3();
                camera.getWorldPosition(cameraWorldPosition);

                if (asteroid.age >= asteroid.maxAge ||
                    asteroid.mesh.position.distanceTo(cameraWorldPosition) > 1500) {
                    scene.remove(asteroid.mesh);
                    asteroids.splice(i, 1);
                }
            }

            ship.translateZ(-1);

            if (keys.w || webcamKeys.w) ship.rotateX(0.02);
            if (keys.a || webcamKeys.a) ship.rotateZ(0.02);
            if (keys.s || webcamKeys.s) ship.rotateX(-0.02);
            if (keys.d || webcamKeys.d) ship.rotateZ(-0.02);

            if (isShooting && performance.now() - lastShotTime >= SHOT_INTERVAL) {
                shootBullet();
                lastShotTime = performance.now();
            }

            updateBullets();
            createThrusterParticle();
            updateThrusterParticles();

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            isShooting = false;
            keyboardShooting = false;
            resetWebcamKeys();
            resetKeys();
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function restartGame() {
            asteroids.forEach(asteroid => scene.remove(asteroid.mesh));
            asteroids = [];
            clearBullets();
            clearThrusterParticles();
            spawnTimer = 0;
            lastShotTime = 0;
            score = 0;
            updateScoreDisplay();
            isGameOver = false;
            webcamBlueDetected = false;
            keyboardShooting = false;

            document.getElementById("gameover-screen").style.display = "none";
            resetKeys();
            resetWebcamKeys();
        }

        document.getElementById("restart-btn").addEventListener("click", restartGame);

        const mainMenu = document.getElementById("menu-home");
        const menuToggle = document.getElementById("menu-toggle");
        const menuOverlay = document.getElementById("menu-overlay");
        const startGameButton = document.getElementById("start-game-btn");
        const aboutGameButton = document.getElementById("about-game-btn");
        const playMenuLink = document.getElementById("play-menu-link");
        const aboutMenuLink = document.getElementById("about-menu-link");

        function setNavigationOpen(open) {
            menuToggle.classList.toggle("is-open", open);
            menuOverlay.classList.toggle("is-open", open);
            menuToggle.setAttribute("aria-expanded", String(open));
            menuToggle.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
            menuOverlay.toggleAttribute("inert", !open);
            document.body.style.overflow = open ? "hidden" : "";
        }

        function startGame() {
            setNavigationOpen(false);
            mainMenu.hidden = true;
            isInMenu = false;
            isGameOver = false;

            document.getElementById("gameover-screen").style.display = "none";
            menuToggle.style.display = "flex";
            ammoHud.style.display = "block";
            document.getElementById("crosshair").style.display = "block";
            scoreHud.style.display = "block";

            clearBullets();
            clearThrusterParticles();
            score = 0;
            updateScoreDisplay();
            updateAmmoDisplay();
            resetKeys();
            resetWebcamKeys();
            startWebcam();
        }

        function returnToMainMenu() {
            isInMenu = true;
            isGameOver = false;
            isShooting = false;
            keyboardShooting = false;
            webcamBlueDetected = false;

            clearBullets();
            clearThrusterParticles();
            ammoHud.style.display = "none";
            document.getElementById("crosshair").style.display = "none";
            scoreHud.style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";

            setNavigationOpen(false);
            mainMenu.hidden = false;
            menuToggle.style.display = "none";
            document.body.style.overflow = "";

            resetKeys();
            resetWebcamKeys();
            stopWebcam();
        }

        menuToggle.addEventListener("click", () => {
            setNavigationOpen(!menuOverlay.classList.contains("is-open"));
        });

        startGameButton.addEventListener("click", startGame);

        playMenuLink.addEventListener("click", event => {
            event.preventDefault();
            startGame();
        });

        function showAbout() {
            setNavigationOpen(false);
            window.alert(
                "Starlight Interceptor: pilot your starfighter, dodge incoming asteroids, and survive as long as you can. Use W, A, S, D or move a red object in front of your webcam to steer. Show a blue object to the webcam to shoot automatically, or hold the Space bar to shoot yellow bullets. Each asteroid takes two hits to destroy. You have 20 bullets per reload, with a 1.8-second reload cooldown. Your ship always moves forward."
            );
        }

        aboutGameButton.addEventListener("click", showAbout);

        aboutMenuLink.addEventListener("click", event => {
            event.preventDefault();
            showAbout();
        });

        window.addEventListener("keydown", event => {
            if (event.key !== "Escape") return;

            if (menuOverlay.classList.contains("is-open")) {
                setNavigationOpen(false);
                return;
            }

            if (!mainMenu.hidden) return;
            returnToMainMenu();
        });

        setNavigationOpen(false);
        renderer.setAnimationLoop(animate);

        window.addEventListener("resize", () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            w = width;
            h = height;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
