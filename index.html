<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight Interceptor</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    #webcam {
        width: 200px;
        height: 200px;
        background-color: gray;
        border: 3px solid rgb(0, 106, 255);
    }
    #vElement{
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        overflow: hidden;
    }
</style>
<body>

<div id = "webcam">
    <video autoplay="true" id="vElement"></video>
</div>

<script>
    navigator.mediaDevices.getUserMedia({video: true})
        .then(stream => document.querySelector("#vElement").srcObject = stream);
</script> 
</body>
</html>
