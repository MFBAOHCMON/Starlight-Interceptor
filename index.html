
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Interceptor</title>

    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;1,400&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
        }

        body {
            background-color: #080a12;
        }

        @keyframes move-twinkle-back {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        @keyframes move-clouds-back {
            from { background-position: 0 0; }
            to { background-position: 10000px 0; }
        }

        .stars,
        .twinkling,
        .clouds {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            pointer-events: none;
        }

        .stars {
            background: #000 url(stars.png) repeat top center;
            z-index: 0;
        }

        .twinkling {
            background: transparent url(twinkling.png) repeat top center;
            z-index: 1;
            animation: move-twinkle-back 200s linear infinite;
        }

        .clouds {
            background: transparent url(clouds.png) repeat top center;
            z-index: 2;
            opacity: .4;
            animation: move-clouds-back 200s linear infinite;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: auto;
        }

        :root {
            --menu-font-body: 'DM Sans', sans-serif;
            --menu-font-display: 'Bebas Neue', sans-serif;
            --menu-accent: #ff3b00;
            --menu-bg: #080a12;
        }

        /* MAIN MENU */
        #menu-home {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            color: #f0f0f4;
            font-family: var(--menu-font-body);
            background:
                radial-gradient(ellipse at 50% 40%, rgba(28, 65, 115, .45), transparent 55%),
                linear-gradient(135deg, rgba(4, 7, 17, .96), rgba(10, 13, 25, .92));
            overflow: hidden;
        }

        #menu-home::before {
            content: "";
            position: absolute;
            inset: -50%;
            pointer-events: none;
            opacity: .35;
            background-image:
                radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent 60%),
                radial-gradient(1px 1px at 70% 20%, #7ddcff 50%, transparent 60%),
                radial-gradient(2px 2px at 80% 70%, #fff 50%, transparent 60%),
                radial-gradient(1px 1px at 35% 80%, #9bbcff 50%, transparent 60%);
            background-size: 260px 240px, 310px 300px, 370px 330px, 220px 280px;
            animation: menu-stars-drift 55s linear infinite;
        }

        @keyframes menu-stars-drift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-120px, 80px, 0); }
        }

        .menu-hero {
            position: relative;
            z-index: 1;
            width: min(100%, 1000px);
            animation: menu-hero-in .8s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes menu-hero-in {
            from { opacity: 0; transform: translateY(22px) scale(.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .menu-eyebrow {
            margin-bottom: 1.25rem;
            color: #a5b3c8;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .34em;
            text-transform: uppercase;
        }

        .menu-hero h1 {
            margin: 0 0 1.25rem;
            font-family: var(--menu-font-display);
            font-size: clamp(4.5rem, 14vw, 10rem);
            line-height: .82;
            letter-spacing: .015em;
            color: #f6f8ff;
            text-shadow: 0 0 38px rgba(60, 157, 255, .18);
        }

        .menu-hero h1 span {
            display: block;
            color: transparent;
            -webkit-text-stroke: 1.5px #8db7ef;
        }

        .menu-description {
            max-width: 620px;
            margin: 1.8rem auto 2rem;
            color: #a9b4c6;
            font-size: clamp(.95rem, 2vw, 1.08rem);
            line-height: 1.8;
        }

        .menu-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: .9rem;
            margin-bottom: 2.25rem;
        }

        .menu-action {
            min-width: 150px;
            border: 1px solid rgba(143, 185, 244, .45);
            border-radius: 999px;
            padding: .95rem 1.7rem;
            background: rgba(24, 45, 76, .62);
            color: #fff;
            font: 700 .85rem var(--menu-font-body);
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform .25s ease, background .25s ease,
                border-color .25s ease, box-shadow .25s ease;
        }

        .menu-action:hover {
            transform: translateY(-3px);
            background: rgba(43, 90, 151, .72);
            border-color: #8dc7ff;
            box-shadow: 0 10px 35px rgba(20, 122, 255, .18);
        }

        .menu-action.primary {
            background: #ff3b00;
            border-color: #ff3b00;
            box-shadow: 0 8px 28px rgba(255, 59, 0, .2);
        }

        .menu-action.primary:hover {
            background: #ff5726;
            border-color: #ff5726;
            box-shadow: 0 10px 38px rgba(255, 59, 0, .32);
        }

        .menu-preview {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: .7rem;
            width: min(100%, 760px);
            margin: 0 auto;
            opacity: .75;
        }

        .menu-preview div {
            height: clamp(52px, 8vw, 88px);
            border: 1px solid rgba(144, 183, 237, .18);
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(79, 112, 157, .25), rgba(14, 25, 44, .4));
            box-shadow: inset 0 1px rgba(255,255,255,.04);
        }

        .menu-preview div:nth-child(2),
        .menu-preview div:nth-child(4) {
            background: linear-gradient(135deg, rgba(255, 75, 25, .16), rgba(17, 29, 50, .45));
        }

        #menu-home[hidden] {
            display: none;
        }

        /* HAMBURGER BUTTON */
        #menu-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 120;
            width: 3.25rem;
            height: 3.25rem;
            border: 1px solid rgba(160, 190, 235, .2);
            border-radius: 50%;
            background: #171d2a;
            cursor: pointer;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .3);
            transition: background .3s, transform .3s;
        }

        #menu-toggle:hover {
            background: var(--menu-accent);
            transform: scale(1.06);
        }

        #menu-toggle span {
            display: block;
            width: 1.35rem;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: transform .4s cubic-bezier(.7,0,.2,1), opacity .3s, width .3s;
        }

        #menu-toggle.is-open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        #menu-toggle.is-open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        #menu-toggle.is-open span:nth-child(2) {
            opacity: 0;
            width: 0;
        }

        /* ANIMATED NAVIGATION OVERLAY */
        #menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 110;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: none;
            background: var(--menu-bg);
            clip-path: circle(0% at calc(100% - 3.125rem) 3.125rem);
            transition: clip-path .75s cubic-bezier(.76,0,.24,1);
            visibility: hidden;
        }

        #menu-overlay.is-open {
            clip-path: circle(170% at calc(100% - 3.125rem) 3.125rem);
            pointer-events: auto;
            visibility: visible;
        }

        .menu-inner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
            width: min(100% - 4rem, 1200px);
            margin: 0 auto;
            padding: 5rem 0 3rem;
            box-sizing: border-box;
        }

        .menu-label {
            margin-bottom: 1.5rem;
            color: #6f7d95;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .3em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .5s, transform .5s;
        }

        #menu-overlay.is-open .menu-label {
            opacity: 1;
            transform: translateY(0);
        }

        .menu-nav {
            display: flex;
            flex-direction: column;
            list-style: none;
            margin: 0;
            padding: 1rem 0;
        }

        .menu-item {
            overflow: hidden;
            border-top: 1px solid #202635;
        }

        .menu-item:last-child {
            border-bottom: 1px solid #202635;
        }

        .menu-link-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .25rem 0;
        }

        .menu-link {
            position: relative;
            padding: .3rem 0;
            color: #f0f3fa;
            font-family: var(--menu-font-display);
            font-size: clamp(3.5rem, 9vw, 8rem);
            line-height: 1;
            letter-spacing: .02em;
            text-decoration: none;
            transform: translateY(110%);
            transition: transform .7s cubic-bezier(.76,0,.24,1), color .25s;
        }

        #menu-overlay.is-open .menu-link {
            transform: translateY(0);
        }

        #menu-overlay.is-open .menu-link#about-menu-link {
            transition-delay: .1s;
        }

        #menu-overlay.is-open .menu-link#play-menu-link {
            transition-delay: .2s;
        }

        .menu-link:hover {
            color: var(--menu-accent);
        }

        .menu-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: .15rem;
            width: 0;
            height: 3px;
            border-radius: 2px;
            background: var(--menu-accent);
            transition: width .35s cubic-bezier(.76,0,.24,1);
        }

        .menu-link:hover::after {
            width: 100%;
        }

        .menu-number {
            padding-bottom: .6rem;
            color: #58647a;
            font-family: var(--menu-font-display);
            font-size: .9rem;
            letter-spacing: .15em;
            opacity: 0;
            transform: translateY(10px);
            transition: transform .4s, opacity .4s;
        }

        #menu-overlay.is-open .menu-number {
            opacity: 1;
            transform: translateY(0);
        }

        #menu-overlay.is-open .menu-item:nth-child(1) .menu-number {
            transition-delay: .1s;
        }

        #menu-overlay.is-open .menu-item:nth-child(2) .menu-number {
            transition-delay: .2s;
        }

        /* GAME OVER SCREEN */
        #gameover-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        #gameover-screen h1 {
            color: #ff4266;
            font-size: 55px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 66, 102, 0.6);
            letter-spacing: 2px;
            font-family: 'Lato', sans-serif;
        }

        #restart-btn {
            background: linear-gradient(135deg, #286bff, #164dff);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-family: 'Lato', sans-serif;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 107, 255, 0.4);
            transition: all 0.2s ease;
        }

        #restart-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #3d7aff, #286bff);
            box-shadow: 0 6px 20px rgba(40, 107, 255, 0.6);
        }

        @media (max-width: 600px) {
            #menu-home {
                padding: 1.25rem;
                box-sizing: border-box;
            }

            .menu-preview {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .menu-inner {
                width: calc(100% - 2.5rem);
            }

            #menu-toggle {
                top: 1rem;
                right: 1rem;
            }

            #gameover-screen h1 {
                font-size: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <!-- MAIN MENU -->
    <section id="menu-home" aria-label="Star Interceptor main menu">
        <div class="menu-hero">
            <p class="menu-eyebrow">GAME FOR HACKATHON</p>
            <h1>Star <span>Interceptor</span></h1>
            <p class="menu-description">
                Pilot an agile starfighter through hazardous debris fields and alien armadas.
                Dodge asteroids, explore deep space, and see how long you can survive.
            </p>

            <div class="menu-actions">
                <button class="menu-action primary" id="start-game-btn">Play Game</button>
                <button class="menu-action" id="about-game-btn">About</button>
            </div>

            <div class="menu-preview" aria-hidden="true">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </section>

    <!-- NAVIGATION TOGGLE -->
    <button id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <!-- NAVIGATION OVERLAY -->
    <nav id="menu-overlay" aria-label="Game navigation" inert>
        <div class="menu-inner">
            <div class="menu-label">Navigation</div>
            <ul class="menu-nav">
                <li class="menu-item">
                    <div class="menu-link-wrap">
                        <a href="#" class="menu-link" id="about-menu-link">About</a>
                        <span class="menu-number">01</span>
                    </div>
                </li>
                <li class="menu-item">
                    <div class="menu-link-wrap">
                        <a href="#" class="menu-link" id="play-menu-link">Play</a>
                        <span class="menu-number">02</span>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- BACKGROUND LAYERS -->
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>

    <!-- GAME OVER -->
    <div id="gameover-screen">
        <h1>GAME OVER</h1>
        <button id="restart-btn">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/102/three.js"></script>

    <script>
        // SCENE SETUP
        let w = window.innerWidth;
        let h = window.innerHeight;

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(75, w / h, 0.1, 1000);
        camera.position.set(0, 3, 10);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

        renderer.setSize(w, h);
        document.body.appendChild(renderer.domElement);

        // LIGHTING
        const light = new THREE.AmbientLight("#ffffff", 1.5);
        scene.add(light);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight("#ffffff", 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ASTEROID TEXTURES
        const textureLoader = new THREE.TextureLoader();

        const tilesBaseColor = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_basecolor.png');
        const tilesNormalMap = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_normal.png');
        const tilesHeightMap = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_height.png');
        const tilesRoughnessMap = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_roughness.png');
        const tilesAmbientOcclusionMap = textureLoader.load('./picture/Cobblestone_Irregular_Floor_001_ambientOcclusion.png');

        const asteroidGeometry = new THREE.DodecahedronGeometry(5, 1);

        const asteroidMaterial = new THREE.MeshStandardMaterial({
            map: tilesBaseColor,
            normalMap: tilesNormalMap,
            displacementMap: tilesHeightMap,
            displacementScale: 0.6,
            roughnessMap: tilesRoughnessMap,
            roughness: 0.8,
            aoMap: tilesAmbientOcclusionMap
        });

        // GAME VARIABLES
        let asteroids = [];
        let spawnTimer = 0;
        const SPAWN_INTERVAL = 25;
        let isGameOver = false;
        let isInMenu = true;

        // SPAWN ASTEROID
        function spawnAsteroid() {
            const mesh = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
            const scale = 1.5 + Math.random() * 2.0;

            mesh.scale.set(
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4),
                scale * (0.8 + Math.random() * 0.4)
            );

            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 200 + Math.random() * 100;

            mesh.position.set(
                camera.position.x + r * Math.sin(phi) * Math.cos(theta),
                camera.position.y + r * Math.sin(phi) * Math.sin(theta),
                camera.position.z + r * Math.cos(phi)
            );

            scene.add(mesh);

            const randomDirection = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize();

            const speed = 0.15 + Math.random() * 0.2;

            const rotSpeed = new THREE.Vector3(
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015,
                (Math.random() - 0.5) * 0.015
            );

            asteroids.push({
                mesh,
                velocity: randomDirection.multiplyScalar(speed),
                rotSpeed,
                age: 0,
                maxAge: 3600
            });
        }

        // SHIP MATERIALS
        const mat = {
            hull: new THREE.MeshStandardMaterial({
                color: 0x263746,
                metalness: 0.8,
                roughness: 0.32,
                flatShading: true
            }),
            armor: new THREE.MeshStandardMaterial({
                color: 0x8799a5,
                metalness: 0.75,
                roughness: 0.3,
                flatShading: true
            }),
            dark: new THREE.MeshStandardMaterial({
                color: 0x101a27,
                metalness: 0.7,
                roughness: 0.35,
                flatShading: true
            }),
            gold: new THREE.MeshStandardMaterial({
                color: 0xd9a45b,
                metalness: 0.8,
                roughness: 0.25,
                flatShading: true
            }),
            glass: new THREE.MeshStandardMaterial({
                color: 0x09263e,
                emissive: 0x0874a0,
                emissiveIntensity: 0.8,
                metalness: 0.7,
                roughness: 0.12,
                flatShading: true
            }),
            cyan: new THREE.MeshStandardMaterial({
                color: 0x40f4ff,
                emissive: 0x00dfff,
                emissiveIntensity: 3
            }),
            blue: new THREE.MeshStandardMaterial({
                color: 0x286bff,
                emissive: 0x164dff,
                emissiveIntensity: 3
            }),
            red: new THREE.MeshStandardMaterial({
                color: 0xff4266,
                emissive: 0xff153d,
                emissiveIntensity: 2
            })
        };

        // SHIP SETUP
        const ship = new THREE.Group();
        scene.add(ship);
        ship.add(camera);

        function createMesh(geo, material, pos, rot = [0, 0, 0], parent = ship) {
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(...pos);
            mesh.rotation.set(...rot);
            mesh.castShadow = mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        function box(material, pos, size, rot = [0, 0, 0]) {
            return createMesh(new THREE.BoxGeometry(...size), material, pos, rot);
        }

        function cyl(material, pos, top, bottom, height, sides = 8, rot = [0, 0, 0]) {
            return createMesh(
                new THREE.CylinderGeometry(top, bottom, height, sides),
                material,
                pos,
                rot
            );
        }

        function beam(material, a, b, radius = 0.025, sides = 6) {
            const start = new THREE.Vector3(...a);
            const direction = new THREE.Vector3(...b).sub(start);
            const length = direction.length();

            if (!length) return;

            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, length, sides),
                material
            );

            mesh.position.copy(start).addScaledVector(direction, 0.5);
            mesh.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                direction.normalize()
            );

            mesh.castShadow = mesh.receiveShadow = true;
            ship.add(mesh);
            return mesh;
        }

        function wing(s) {
            const shape = new THREE.Shape();

            shape.moveTo(s * 0.45, -1.5);
            shape.lineTo(s * 4.5, -0.3);
            shape.lineTo(s * 5.5, 1.7);
            shape.lineTo(s * 3.1, 1.25);
            shape.lineTo(s, 2.25);
            shape.lineTo(s * 0.45, 1.1);
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, {
                depth: 0.24,
                bevelEnabled: false
            });

            geo.rotateX(Math.PI / 2);
            geo.translate(0, 0.12, 0);

            createMesh(geo, mat.hull, [0, 0, 0]);

            beam(mat.armor, [s * 0.45, 0.04, -1.5], [s * 4.5, 0.04, -0.3], 0.07);
            beam(mat.gold, [s * 4.5, 0.04, -0.3], [s * 5.5, 0.04, 1.7], 0.035);
        }

        // MAIN BODY
        createMesh(
            new THREE.CylinderGeometry(0.28, 0.72, 5.1, 6),
            mat.hull,
            [0, 0, 0],
            [Math.PI / 2, 0, 0]
        );

        createMesh(
            new THREE.ConeGeometry(0.48, 2, 6),
            mat.armor,
            [0, 0, -3.4],
            [Math.PI / 2, 0, 0]
        );

        createMesh(
            new THREE.ConeGeometry(0.29, 1.05, 6),
            mat.dark,
            [0, 0, -4],
            [Math.PI / 2, 0, 0]
        );

        box(mat.gold, [0, 0.12, -3.55], [0.1, 0.1, 0.85]);

        createMesh(
            new THREE.CylinderGeometry(0.3, 0.46, 2.7, 5),
            mat.armor,
            [0, 0.43, -0.65],
            [Math.PI / 2, 0, 0]
        );

        box(mat.dark, [0, 0.67, 0.35], [0.76, 0.23, 1.65]);
        box(mat.armor, [0, 0.81, 0.12], [0.53, 0.09, 1.15]);

        const cockpit = createMesh(
            new THREE.SphereGeometry(0.67, 6, 4),
            mat.glass,
            [0, 0.52, -1.72]
        );

        cockpit.scale.set(0.76, 0.58, 1.24);

        beam(mat.armor, [-0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.armor, [0.42, 0.63, -2.15], [0, 0.84, -2.58], 0.035);
        beam(mat.gold, [0, 0.84, -2.58], [0, 0.25, -1.35], 0.025);

        for (const s of [-1, 1]) {
            beam(mat.armor, [s * 0.48, 0.36, -2.2], [s * 0.62, 0.24, -1.15], 0.055);
            box(mat.gold, [s * 0.47, 0.28, -1.55], [0.09, 0.08, 0.38]);
        }

        wing(-1);
        wing(1);

        // ENGINES
        function engine(x) {
            const group = new THREE.Group();
            group.position.set(x, -0.1, 1.65);
            ship.add(group);

            const part = (geo, material, pos, rot = [Math.PI / 2, 0, 0]) =>
                createMesh(geo, material, pos, rot, group);

            part(new THREE.CylinderGeometry(0.34, 0.43, 1.65, 8), mat.dark, [0, 0, 0.05]);
            part(new THREE.CylinderGeometry(0.31, 0.36, 0.18, 8), mat.armor, [0, 0, 0.78]);
            part(new THREE.CylinderGeometry(0.23, 0.3, 0.12, 8), mat.gold, [0, 0, 0.9]);
            part(new THREE.CylinderGeometry(0.19, 0.24, 0.18, 8), mat.dark, [0, 0, 1.02]);
            part(new THREE.CylinderGeometry(0.13, 0.18, 0.14, 8), mat.cyan, [0, 0, 1.15]);
            part(new THREE.CylinderGeometry(0.07, 0.12, 0.08, 8), mat.blue, [0, 0, 1.25]);
            part(new THREE.ConeGeometry(0.19, 0.85, 8), mat.blue, [0, 0, 1.7]);

            const engineLight = new THREE.PointLight(0x00cfff, 4, 4);
            engineLight.position.set(0, 0, 1.6);
            group.add(engineLight);
        }

        engine(-0.82);
        engine(0.82);

        cyl(mat.dark, [0, -0.5, 0.45], 0.32, 0.38, 0.45, 6);
        cyl(mat.gold, [0, -0.75, 0.45], 0.24, 0.28, 0.1, 8);
        cyl(mat.cyan, [0, -0.82, 0.45], 0.16, 0.16, 0.06, 8);

        box(mat.dark, [0, -0.42, -0.5], [0.55, 0.3, 1.5]);
        box(mat.gold, [0, -0.6, -0.5], [0.28, 0.055, 0.8]);

        cyl(mat.dark, [0, 0.94, 0.55], 0.06, 0.09, 0.55, 6);
        cyl(mat.gold, [0, 1.23, 0.55], 0.08, 0.08, 0.1, 6);

        beam(mat.armor, [0, 1.24, 0.55], [0, 1.95, 0.55]);
        beam(mat.armor, [-0.3, 1.63, 0.55], [0.3, 1.63, 0.55], 0.02);

        createMesh(
            new THREE.IcosahedronGeometry(0.09, 0),
            mat.cyan,
            [0, 1.98, 0.55]
        );

        for (const s of [-1, 1]) {
            const fin = createMesh(
                new THREE.ConeGeometry(0.35, 1.15, 4),
                mat.armor,
                [s * 0.53, 0.34, 2.22],
                [Math.PI / 2, 0, -s * 0.42]
            );

            fin.scale.set(0.65, 1, 1);

            beam(mat.gold, [s * 0.45, 0.3, 1.55], [s * 0.62, 0.76, 1.9], 0.025);

            createMesh(
                new THREE.IcosahedronGeometry(0.075, 0),
                mat.cyan,
                [s * 0.62, 0.76, 1.9]
            );

            beam(mat.cyan, [s * 0.36, 0.06, -1], [s * 0.43, 0.06, 1.15], 0.025);
            beam(mat.gold, [s * 0.34, -0.2, -0.55], [s * 0.34, -0.2, 0.65], 0.022);

            for (let i = 0; i < 5; i++) {
                box(
                    i % 2 === 0 ? mat.armor : mat.dark,
                    [s * 0.43, 0.18, -0.45 + i * 0.34],
                    [0.08, 0.11, 0.15]
                );
            }

            cyl(mat.dark, [s * 0.56, 0.15, -1.25], 0.14, 0.18, 0.42, 6, [0, 0, Math.PI / 2]);

            createMesh(
                new THREE.IcosahedronGeometry(0.075, 0),
                mat.cyan,
                [s * 0.82, 0.15, -1.25]
            );
        }

        const rim = new THREE.PointLight(0x167dff, 35, 25);
        rim.position.set(-6, 3, -5);
        scene.add(rim);

        const fill = new THREE.PointLight(0x00dfff, 12, 18);
        fill.position.set(5, -2, 3);
        scene.add(fill);

        // PLAYER CONTROLS
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            shift: false
        };

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });

        window.addEventListener('keyup', (event) => {
            const key = event.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // ANIMATION LOOP
        function animate() {
            if (isGameOver || isInMenu) {
                renderer.render(scene, camera);
                return;
            }

            spawnTimer++;

            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnAsteroid();
                spawnTimer = 0;
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];

                asteroid.mesh.position.add(asteroid.velocity);

                asteroid.mesh.rotation.x += asteroid.rotSpeed.x;
                asteroid.mesh.rotation.y += asteroid.rotSpeed.y;
                asteroid.mesh.rotation.z += asteroid.rotSpeed.z;

                asteroid.age++;

                const asteroidCenter = new THREE.Vector3();
                asteroid.mesh.getWorldPosition(asteroidCenter);

                const shipCenter = new THREE.Vector3();
                ship.getWorldPosition(shipCenter);

                const asteroidRadius = 5 * Math.max(
                    asteroid.mesh.scale.x,
                    asteroid.mesh.scale.y,
                    asteroid.mesh.scale.z
                );

                const shipRadius = 4.5;

                if (asteroidCenter.distanceTo(shipCenter) < asteroidRadius + shipRadius) {
                    triggerGameOver();
                    break;
                }

                if (asteroid.age >= asteroid.maxAge ||
                    asteroid.mesh.position.distanceTo(camera.position) > 1500) {
                    scene.remove(asteroid.mesh);
                    asteroids.splice(i, 1);
                    continue;
                }
            }

            if (keys.shift) ship.translateZ(-1);
            if (keys.w) ship.rotateX(0.02);
            if (keys.a) ship.rotateZ(0.02);
            if (keys.s) ship.rotateX(-0.02);
            if (keys.d) ship.rotateZ(-0.02);

            renderer.render(scene, camera);
        }

        // GAME OVER
        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function restartGame() {
            asteroids.forEach((asteroid) => scene.remove(asteroid.mesh));

            asteroids = [];
            spawnTimer = 0;
            isGameOver = false;

            document.getElementById('gameover-screen').style.display = 'none';
            resetKeys();
        }

        document.getElementById('restart-btn').addEventListener('click', restartGame);

        // MENU / GAME FLOW
        const mainMenu = document.getElementById('menu-home');
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.getElementById('menu-overlay');

        const startGameButton = document.getElementById('start-game-btn');
        const aboutGameButton = document.getElementById('about-game-btn');

        const playMenuLink = document.getElementById('play-menu-link');
        const aboutMenuLink = document.getElementById('about-menu-link');

        function setNavigationOpen(open) {
            menuToggle.classList.toggle('is-open', open);
            menuOverlay.classList.toggle('is-open', open);

            menuToggle.setAttribute('aria-expanded', String(open));
            menuToggle.setAttribute(
                'aria-label',
                open ? 'Close navigation menu' : 'Open navigation menu'
            );

            menuOverlay.toggleAttribute('inert', !open);
            document.body.style.overflow = open ? 'hidden' : '';
        }

        function resetKeys() {
            Object.keys(keys).forEach((key) => {
                keys[key] = false;
            });
        }

        function startGame() {
            setNavigationOpen(false);

            mainMenu.hidden = true;
            isInMenu = false;
            isGameOver = false;

            document.getElementById('gameover-screen').style.display = 'none';
            menuToggle.style.display = 'flex';

            resetKeys();
        }

        function returnToMainMenu() {
            isInMenu = true;
            isGameOver = false;

            document.getElementById('gameover-screen').style.display = 'none';

            setNavigationOpen(false);
            mainMenu.hidden = false;
            menuToggle.style.display = 'none';
            document.body.style.overflow = '';

            resetKeys();
        }

        menuToggle.addEventListener('click', () => {
            setNavigationOpen(!menuOverlay.classList.contains('is-open'));
        });

        startGameButton.addEventListener('click', startGame);

        playMenuLink.addEventListener('click', (event) => {
            event.preventDefault();
            startGame();
        });

        function showAbout() {
            setNavigationOpen(false);

            window.alert(
                'Star Interceptor: pilot your starfighter, dodge incoming asteroids, and survive as long as you can. Use W, A, S, D to steer and Shift to boost.'
            );
        }

        aboutGameButton.addEventListener('click', showAbout);

        aboutMenuLink.addEventListener('click', (event) => {
            event.preventDefault();
            showAbout();
        });

        // ESCAPE BEHAVIOR:
        // 1. If navigation is open, close only the navigation.
        // 2. Otherwise, if the game is active or game over, return to main menu.
        // 3. If already on the main menu, do nothing.
        window.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;

            if (menuOverlay.classList.contains('is-open')) {
                setNavigationOpen(false);
                return;
            }

            if (!mainMenu.hidden) {
                return;
            }

            returnToMainMenu();
        });

        // START CLOSED
        setNavigationOpen(false);

        // START RENDERING
        renderer.setAnimationLoop(animate);

        // RESIZE
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            w = width;
            h = height;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        });
    </script>
</body>

</html>
